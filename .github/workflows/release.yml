name: Auto Release

on:
  push:
    branches:
      - dev

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git diff

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Setup git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Write .npmrc
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: corepack enable
      - run: pnpm install

      - name: Create fallback changeset (if none exist)
        run: |
          set -euo pipefail
          
          mkdir -p .changeset
          
          if [ -z "$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null)" ]; then
            echo "No manual changeset found. Generating fallback changeset."
          else
            echo "🟢 Manual changeset found. Skipping fallback generation."
            exit 0
          fi

          # changed_packages=$(git diff --name-only HEAD~1...HEAD | grep '^packages/' | cut -d '/' -f2 | sort -u)
          echo "🧪 Running: git diff --name-only HEAD~1...HEAD"
          git_diff_output=$(git diff --name-only HEAD~1...HEAD || { echo "❌ git diff failed"; exit 1; })
          
          echo "📄 Files changed:"
          echo "$git_diff_output"
          
          echo "🔍 Filtering only files inside 'packages/'..."
          packages_only=$(echo "$git_diff_output" | grep '^packages/' || true)
          
          if [ -z "$packages_only" ]; then
          echo "🟢 No files in packages/* changed."
          changed_packages=""
          else
          echo "📦 Changed files in packages/:"
          echo "$packages_only"
          
          changed_packages=$(echo "$packages_only" | cut -d '/' -f2 | sort -u)
          fi

          if [ -z "$changed_packages" ]; then
            echo "🟢 No changed packages, skipping release."
            exit 0
          fi
          
          echo "Changed packages: $changed_packages"

          # Generate changeset
          echo "---" > .changeset/ci-auto.md
          for pkg in $changed_packages; do
             name=$(jq -r .name packages/$pkg/package.json)
             echo "\"$name\": patch" >> .changeset/ci-auto.md
          done
          echo "---" >> .changeset/ci-auto.md
          echo "Auto-generated changeset from CI" >> .changeset/ci-auto.md
          
          echo "Generated changeset contents:"
          cat .changeset/ci-auto.md

      - name: Build
        run: pnpm prepublish

      - name: Version & publish
        run: |
          echo "Running pnpm exec changeset version..."
          pnpm exec changeset version
          # Check the diff after version bump
          echo "Checking changes in package.json:"
          git diff package.json
          echo "Checking changes are committed:"
          git status
          pnpm install
          echo "Running pnpm exec changeset publish..."
          pnpm exec changeset publish
          echo "Pushing changes..."
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
